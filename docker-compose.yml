version: "3.5"
services:
  postgresql:
    environment:
      POSTGRES_PASSWORD: local
      POSTGRES_USER: local
    image: postgres:13
    ports:
      - 5432:5432
  prometheus:
    image: prom/prometheus
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml"
    networks:
      - localprom
    ports:
      - 9090:9090
  node-exporter:
    image: prom/node-exporter
    networks:
      - localprom
    ports:
      - 9100:9100
networks:
  localprom:
    driver: bridge
